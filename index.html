/* TANDZUR motion system */
:root{--ease-spring:cubic-bezier(.22,1,.36,1)}
#content{animation:pageReveal .48s var(--ease-spring) both;transform-origin:top center}
#content.page-enter{animation:pageReveal .48s var(--ease-spring) both}
@keyframes pageReveal{from{opacity:0;transform:translateY(13px) scale(.992);filter:blur(3px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.stat,.panel,.tool,.task,.hero,.day{transition:transform .3s var(--ease-spring),box-shadow .3s ease,border-color .25s ease,background-color .25s ease,opacity .25s ease}
.tool:hover,.day:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 12px 28px #0003}
.task:hover,.stat:hover{transform:translateY(-2px)}
.btn,.nav button,.bottom button{transition:transform .22s var(--ease-spring),background-color .25s ease,color .25s ease,box-shadow .25s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 18px #0003}.btn:active,.nav button:active,.bottom button:active{transform:scale(.96)}
.modalback{animation:backdropIn .28s ease both}.modal{animation:modalPop .4s var(--ease-spring) both}
@keyframes backdropIn{from{opacity:0}to{opacity:1}}
@keyframes modalPop{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast{animation:toastIn .35s var(--ease-spring) both}@keyframes toastIn{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.meter>div,.chartbar{transition:width .65s var(--ease-spring)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

let tandzurRole='blocked',tandzurNickname='Gus',tandzurQuoteIndex=0,tandzurQuoteOrder=[],tandzurQuoteAt=0;
function tandzurGreeting(){const h=new Date().getHours();return h>=4&&h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'}
function tandzurShuffleQuotes(){tandzurQuoteOrder=Array.from({length:TANDZUR_MOTIVASI.length},(_,i)=>i);for(let i=tandzurQuoteOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tandzurQuoteOrder[i],tandzurQuoteOrder[j]]=[tandzurQuoteOrder[j],tandzurQuoteOrder[i]];}tandzurQuoteIndex=0;}
function tandzurMotivation(){if(!tandzurQuoteOrder.length)tandzurShuffleQuotes();return TANDZUR_MOTIVASI[tandzurQuoteOrder[tandzurQuoteIndex]];}
function tandzurRefreshGreeting(){const h=document.getElementById('pagetitle');if(h&&view==='home')h.textContent=tandzurGreeting()+', '+tandzurNickname+'! 🌿';const q=document.getElementById('pagesub');if(q&&view==='home')q.textContent=tandzurMotivation();}
function tandzurRotateMotivation(){if(Date.now()-tandzurQuoteAt<300000)return;tandzurQuoteAt=Date.now();tandzurQuoteIndex++;if(tandzurQuoteIndex>=TANDZUR_MOTIVASI.length)tandzurShuffleQuotes();tandzurRefreshGreeting();}
window.tandzurRoleChanged=(role,nickname)=>{tandzurRole=role;tandzurNickname=nickname||'Gus';if(role==='blocked'){const x=document.getElementById('tandzurLoginOverlay');if(x){x.style.display='flex';const msg=document.getElementById('tandzurLoginError');if(msg){msg.textContent='Akun ini belum mendapat akses kebun. Minta Owner menambahkan Gmail ini.';msg.style.display='block';}}}tandzurRefreshGreeting();if(view==='settings')render();};
window.tandzurAdminList=(items)=>{const el=document.getElementById('tandzur-admin-list');if(!el)return;el.innerHTML=items.map(x=>'<div class="listrow"><b>'+esc(x.nickname||'Admin')+'</b><div class="sub">'+esc(x.email)+' · '+(x.role==='super_admin'?'Super Admin':'Admin')+'</div><button class="btn alt" data-email="'+esc(x.email)+'" onclick="tandzurRemoveAdmin(this.dataset.email)">Cabut akses</button></div>').join('')||'<p class="sub">Belum ada admin.</p>';};
function tandzurAddAdmin(){const email=document.getElementById('tandzur-admin-email')?.value.trim(),nick=document.getElementById('tandzur-admin-nick')?.value.trim(),role=document.getElementById('tandzur-admin-role')?.value||'admin';if(!email||!nick)return toast('Isi Gmail dan nama panggilan');window.TandzurAndroid?.addGardenAdminWithRole?.(email,nick,role);}
function tandzurRemoveAdmin(email){if(confirm('Cabut akses admin '+email+'?'))window.TandzurAndroid?.removeGardenAdmin?.(email);}
setInterval(()=>{tandzurRotateMotivation();tandzurRefreshGreeting();},30000);

function nav(){document.getElementById('sidenav').innerHTML=NAV.map(n=>`<button class="${view===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');document.getElementById('bottomnav').innerHTML=NAV.map(n=>`<button class="${view===n[0]?'active':''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('')};function go(v){if(view===v)return;view=v;render();window.scrollTo({top:0,behavior:'smooth'})};function toast(s){document.getElementById('toastroot').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>document.getElementById('toastroot').innerHTML='',2800)};function mark(k){done[k]=new Date().toISOString();delete snooze[k];save();closeModal();render();toast('✓ Aktivitas selesai!')};function later(k){let n=new Date();n.setHours(n.getHours()+1,0,0,0);snooze[k]=n.getTime();save();closeModal();render();toast('⏰ Diingatkan lagi pada jam berikutnya')};function closeModal(){document.getElementById('modalroot').innerHTML=''};function openTask(k){let t=DB.tasks.find(x=>key(x)===k);if(!t)return;document.getElementById('modalroot').innerHTML=`<div class="modalback"><div class="modal"><span class="chip">🔔 PENGINGAT KEBUN</span><h2>${ico(t.action)} ${esc(t.action)}</h2><p><b>${esc(t.plants)}</b> · ${t.qty} pot · Angkatan ${esc(t.batch)}</p><div class="notice"><b>ASAL:</b> ${esc(t.source)}<br><b>TUJUAN:</b> ${esc(t.dest)}<br><b>CATATAN:</b> ${esc(t.note)}</div><p class="small">Jadwal: ${fmt(t.date)} · mulai pukul 05.00</p><div class="actions"><button class="btn outline" onclick="later(${JSON.stringify(k).replace(/"/g,'&quot;')})">◷ Nanti</button><button class="btn" onclick="mark(${JSON.stringify(k).replace(/"/g,'&quot;')})">✓ Beres</button></div><p class="small"><a style="color:var(--muted);cursor:pointer" onclick="closeModal()">Tutup tanpa mengubah status</a></p></div></div>`};function taskCard(t){let k=key(t),ok=!!done[k];return `<div class="task ${ok?'done':''}"><div class="taskicon">${ico(t.action)}</div><div class="taskmain"><div class="taskname">${esc(t.action)} · ${esc(t.batch)} <span class="pill">${t.qty} pot</span></div><div class="taskdesc"><b>${esc(t.plants)}</b><br>${esc(t.source)} → ${esc(t.dest)}<br>${esc(t.note)}</div><div class="taskfooter"><span class="small ${ok?'muted':''}">${ok?'✓ Selesai':snooze[k]&&snooze[k]>Date.now()?'◷ Ditunda':'⏰ 05.00 · Belum beres'}</span>${ok?`<button class="btn outline" onclick="undo('${encodeURIComponent(k)}')">Batalkan</button>`:`<div class="actions"><button class="btn outline" onclick="later(decodeURIComponent('${encodeURIComponent(k)}'))">Nanti</button><button class="btn" onclick="mark(decodeURIComponent('${encodeURIComponent(k)}'))">✓ Beres</button></div>`}</div></div></div>`};function undo(s){delete done[decodeURIComponent(s)];save();render()};

// Semua halaman memakai satu model dampak, tanpa mengubah baseline.
function impactModel(){
 const baseline=DB.tasks.filter(t=>t.action==='PANEN');
 const cancelled=baseline.filter(t=>batchCancelled(t));
 const byDate=new Map();for(const t of cancelled){byDate.set(t.date,(byDate.get(t.date)||0)+t.qty)}
 return {cancelled,byDate,qty:cancelled.reduce((n,t)=>n+t.qty,0),harvests:baseline};
}
function impactRange(prefix){const x=impactModel(),base=x.harvests.filter(t=>t.date.startsWith(prefix)),lost=x.cancelled.filter(t=>t.date.startsWith(prefix)),normal=base.reduce((n,t)=>n+t.qty,0),removed=lost.reduce((n,t)=>n+t.qty,0);return {normal,removed,after:normal-removed,dates:[...new Set(lost.map(t=>t.date))].sort(),early:0,late:0}}
function impactStats(prefix){const v=impactRange(prefix),pct=v.normal?Math.round(100*v.removed/v.normal):0;return `<div class="stats"><div class="stat"><label>Target tanpa libur</label><b>${v.normal}</b><small>pot / periode</small></div><div class="stat"><label>Target setelah libur</label><b>${v.after}</b><small>pot / periode</small></div><div class="stat"><label>Pot batal terjadwal</label><b>${v.removed}</b><small>${pct}% dari target normal</small></div><div class="stat"><label>Panen dini / lewat umur</label><b>${v.early} / ${v.late}</b><small>Belum ada penjadwalan ulang</small></div></div>`}
function holidayImpactNotice(prefix){let v=impactRange(prefix);if(!v.removed)return '';return `<div class="notice" style="margin:12px 0">☀️ <b>Dampak libur:</b> ${v.removed} pot dari target periode ini batal terjadwal pada ${v.dates.map(fmt).join(', ')}. Tidak ada panen dini atau lewat umur yang otomatis dijadwalkan.</div>`}
